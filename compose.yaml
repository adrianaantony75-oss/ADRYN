services:
  workspace:
    build: .
    ports:
      - "127.0.0.1:8502:8501"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
  api:
    build: .
    command: ["python", "-m", "uvicorn", "adryn.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./outputs:/app/outputs:ro
      - ./data:/app/data:ro
