[project]
name = "adryn"
version = "0.2.0"
description = "Subscription decision intelligence, customer analytics and data trust workspace"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.8",
    "faker>=37.0.0",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.2.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "streamlit>=1.41.0",
    "plotly>=6,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "joblib>=1.4,<2",
    "shap>=0.48,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.0",
    "httpx>=0.28,<1",
]

[project.scripts]
adryn = "adryn.cli:cli"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adryn = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

