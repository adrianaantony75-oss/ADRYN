name: ADRYN checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: adryn
          POSTGRES_PASSWORD: adryn_ci_only
          POSTGRES_DB: adryn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adryn -d adryn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ADRYN_TEST_DATABASE_URL: postgresql://adryn:adryn_ci_only@localhost:5432/adryn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -c requirements.lock.txt -e '.[dev]'
      - run: ruff check src app tests
      - run: pytest -q
